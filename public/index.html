<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Confidentialité : pas d'indexation, pas de référent transmis -->
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
  <meta name="referrer" content="no-referrer">

  <!-- Aperçu WhatsApp volontairement NEUTRE : rien sur la grossesse ici.
       Ces balises ne servent que si le contrôle d'accès est DÉSACTIVÉ.
       S'il est actif, l'aperçu vient de acces.config.js (title, description).
       Elles sont fixes car WhatsApp n'exécute pas le JavaScript. -->
  <title>Une petite surprise ✉️</title>
  <meta name="description" content="Un petit mot rien que pour vous.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Une petite surprise ✉️">
  <meta property="og:description" content="Un petit mot rien que pour vous.">
  <!-- WhatsApp préfère une URL absolue : remplacez par https://VOTRE-DOMAINE/og-image.jpg après déploiement -->
  <meta property="og:image" content="/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Une enveloppe fermée">

  <meta name="theme-color" content="#F3E4DB">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='14' width='56' height='38' rx='5' fill='%23E9CFC4'/%3E%3Cpath d='M4 18l28 20 28-20' fill='none' stroke='%239E4A57' stroke-width='3'/%3E%3C/svg%3E">

  <link rel="preload" href="assets/fonts/cormorant-garamond-latin-500-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/cormorant-garamond-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <noscript>
    <p class="noscript">Cette petite surprise a besoin de JavaScript pour s’ouvrir.<br>Essayez d’ouvrir le lien dans Safari ou Chrome.</p>
  </noscript>

  <main class="app" id="app" data-step="closed">
    <header class="top">
      <div class="lang-switch" id="langSwitch" role="group" aria-label="Langue · اللغة" hidden></div>
      <h1 class="intro" id="intro">
        <span class="intro-line" data-t="envelopeTitle"></span>
        <span class="intro-names" data-t="envelopeRecipients"></span>
      </h1>
    </header>

    <section class="stage" id="stage">
      <div class="scene" id="scene">
        <!-- Intérieur de l'enveloppe -->
        <div class="env-part env-back"></div>

        <!-- La carte -->
        <article class="card" id="card">
          <div class="card-head">
            <svg class="ornament" viewBox="0 0 160 20" aria-hidden="true">
              <path d="M6 10H58M102 10H154" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
              <circle cx="65" cy="10" r="1.5" fill="currentColor"/><circle cx="95" cy="10" r="1.5" fill="currentColor"/>
              <path d="M80 16.5c-.5-.5-7-5-7-9.2 0-2.3 1.8-3.8 3.7-3.8 1.4 0 2.6.8 3.3 2 .7-1.2 1.9-2 3.3-2 1.9 0 3.7 1.5 3.7 3.8 0 4.2-6.5 8.7-7 9.2z" fill="none" stroke="currentColor" stroke-width="1.2"/>
            </svg>
            <p class="card-to" data-t="cardTo"></p>
          </div>

          <div class="card-body" aria-live="polite">
            <div class="msg" id="msg"></div>

            <div class="reveal" id="reveal">
              <figure class="echo" id="echo">
                <img id="echoImg" alt="" decoding="async">
              </figure>
              <h2 class="reveal-title" id="revealTitle" data-t="revealTitle"></h2>
              <p class="reveal-sub" id="revealSub" data-t="revealSubtitle"></p>
              <div class="sign" id="sign">
                <p class="signature" data-t="signature"></p>
                <p class="due" id="due" data-t="dueDate"></p>
              </div>
            </div>
          </div>
        </article>

        <!-- Devant de l'enveloppe (poche) -->
        <div class="env-part env-front" aria-hidden="true">
          <svg viewBox="0 0 100 64" preserveAspectRatio="none">
            <defs>
              <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#E5BDAE"/><stop offset="1" stop-color="#EDCDC0"/>
              </linearGradient>
              <linearGradient id="gSideR" x1="1" y1="0" x2="0" y2="0">
                <stop offset="0" stop-color="#E5BDAE"/><stop offset="1" stop-color="#EDCDC0"/>
              </linearGradient>
              <linearGradient id="gBottom" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0" stop-color="#E8C4B6"/><stop offset="1" stop-color="#F3DACF"/>
              </linearGradient>
            </defs>
            <path d="M0 0 L49 34.5 Q50 35.2 51 34.5 L100 0 L100 64 L0 64 Z" fill="url(#gSide)"/>
            <path d="M100 0 L51 34.5 Q50 35.2 49 34.5 L100 64 Z" fill="url(#gSideR)"/>
            <path d="M0 64 L46 31.5 Q50 29 54 31.5 L100 64 Z" fill="url(#gBottom)"/>
            <path d="M0 64 L46 31.5 Q50 29 54 31.5 L100 64" fill="none" stroke="#B98A7C" stroke-opacity=".45" stroke-width=".35" vector-effect="non-scaling-stroke"/>
            <path d="M0 0 L49 34.5 M100 0 L51 34.5" fill="none" stroke="#B98A7C" stroke-opacity=".38" stroke-width=".35" vector-effect="non-scaling-stroke"/>
          </svg>
        </div>

        <!-- Rabat -->
        <div class="env-part flap-wrap" id="flapWrap" aria-hidden="true">
          <div class="flap" id="flap">
            <svg class="flap-face flap-out" viewBox="0 0 100 40" preserveAspectRatio="none">
              <defs>
                <linearGradient id="gFlap" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#F0D3C7"/><stop offset="1" stop-color="#E0B5A6"/>
                </linearGradient>
              </defs>
              <path d="M0 0 H100 L53.2 37.6 Q50 40 46.8 37.6 Z" fill="url(#gFlap)"/>
              <path d="M0 0 L46.8 37.6 Q50 40 53.2 37.6 L100 0" fill="none" stroke="#A97B6D" stroke-opacity=".45" stroke-width=".5" vector-effect="non-scaling-stroke"/>
            </svg>
            <svg class="flap-face flap-in" viewBox="0 0 100 40" preserveAspectRatio="none">
              <path d="M0 40 H100 L53.2 2.4 Q50 0 46.8 2.4 Z" fill="#D9AEA0"/>
            </svg>
          </div>
        </div>

        <!-- Cachet de cire -->
        <div class="env-part seal" id="seal" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <defs>
              <radialGradient id="gWax" cx=".38" cy=".32" r=".75">
                <stop offset="0" stop-color="#C0606C"/><stop offset=".6" stop-color="#9A3A48"/><stop offset="1" stop-color="#7A2836"/>
              </radialGradient>
            </defs>
            <path d="M32 3c4 0 5 3 8.6 3.6 3.6.7 6-1.2 8.6 1.4 2.6 2.6 1 5.4 2.5 8.6 1.5 3.3 4.8 4 5.6 7.6.8 3.6-1.8 5.2-1.8 8.8s2.6 5.2 1.8 8.8c-.8 3.6-4.1 4.3-5.6 7.6-1.5 3.2.1 6-2.5 8.6s-5 .7-8.6 1.4C37 60 36 63 32 63s-5-3-8.6-3.6c-3.6-.7-6 1.2-8.6-1.4s-1-5.4-2.5-8.6c-1.5-3.3-4.8-4-5.6-7.6C5.9 38.2 8.5 36.6 8.5 33s-2.6-5.2-1.8-8.8c.8-3.6 4.1-4.3 5.6-7.6 1.5-3.2-.1-6 2.5-8.6s5-.7 8.6-1.4C27 6 28 3 32 3z" fill="url(#gWax)"/>
            <circle cx="32" cy="33" r="19" fill="none" stroke="#6E2230" stroke-opacity=".55" stroke-width="1.4"/>
            <circle cx="32" cy="33" r="19" fill="none" stroke="#E9A3AC" stroke-opacity=".35" stroke-width=".8" transform="translate(-.6 -.8)"/>
            <path d="M32 43.5c-.8-.8-11-7.6-11-14.2 0-3.6 2.8-6 5.8-6 2.2 0 4.1 1.2 5.2 3.1 1.1-1.9 3-3.1 5.2-3.1 3 0 5.8 2.4 5.8 6 0 6.6-10.2 13.4-11 14.2z" fill="#7E2A38" stroke="#E7A0AA" stroke-opacity=".45" stroke-width=".8"/>
          </svg>
        </div>

        <button class="env-button" id="envButton" type="button" data-t-aria="envelopeAria"></button>
      </div>
    </section>

    <footer class="bottom">
      <p class="hint" id="hint" data-t="envelopeHint"></p>
      <button class="btn btn-primary continue" id="continueBtn" type="button" hidden>
        <span data-t="continue"></span> <span aria-hidden="true">›</span>
      </button>
      <div class="actions" id="actions" hidden>
        <div class="actions-row">
          <button class="btn btn-primary" id="saveBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="saveLabel" data-t="save"></span>
          </button>
          <button class="btn btn-round" id="printBtn" type="button" data-t-aria="print" data-t-title="print" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V4h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v6H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn btn-round" id="replayBtn" type="button" data-t-aria="replay" data-t-title="replay">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4.5v3.8h3.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <p class="save-help" data-t="saveHelp"></p>
      </div>
    </footer>

    <button class="music" id="musicBtn" type="button" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="16.5" cy="16" r="2.5" fill="currentColor"/><path class="music-off" d="M4 4l16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>

    <div class="hearts" id="hearts" aria-hidden="true"></div>
  </main>

  <!-- Utilisé uniquement à l'impression -->
  <div class="print-sheet" aria-hidden="true"><img id="printImg" alt=""></div>

  <script src="config.js"></script>
  <script src="js/souvenir.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
